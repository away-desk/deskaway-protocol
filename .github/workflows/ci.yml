name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files are present and non-empty
        run: |
          status=0
          for f in README.md AGENT.md CLAUDE.md CONTRIBUTING.md SECURITY.md \
                   CHANGELOG.md LICENSE .github/pull_request_template.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing"; status=1
            elif [ ! -s "$f" ]; then
              echo "::error file=$f::present but empty"; status=1
            fi
          done
          exit $status

      - name: LICENSE copyright is filled in
        run: |
          if grep -q 'name of copyright owner' LICENSE; then
            echo "::error file=LICENSE::Apache-2.0 placeholder left in place"
            exit 1
          fi

      - name: No empty workflow files
        run: |
          empty=$(find .github/workflows -type f -empty)
          if [ -n "$empty" ]; then
            echo "::error::empty workflow files: $empty"
            exit 1
          fi

      - name: README answers the four questions, in order
        run: |
          expected=$'## Status\n## Running locally\n## The rest of DeskAway'
          actual=$(grep -E '^## (Status|Running locally|The rest of DeskAway)$' README.md)
          if [ "$actual" != "$expected" ]; then
            echo "::error file=README.md::the four README sections are missing or out of order"
            printf 'found:\n%s\n' "$actual"
            exit 1
          fi

      - name: CHANGELOG has an Unreleased heading
        run: |
          grep -q '^## \[Unreleased\]' CHANGELOG.md \
            || { echo "::error file=CHANGELOG.md::no '## [Unreleased]' heading"; exit 1; }

      - name: No credential-shaped files are tracked
        run: |
          hits=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks|keystore|snk|ppk|tfstate|tfvars)$|(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "::error::credential-shaped files are tracked: $hits"
            exit 1
          fi

      - name: .gitignore blocks key material
        run: |
          status=0
          for p in .env .env.local server.pem private.key client.p12; do
            git check-ignore -q "$p" || { echo "::error file=.gitignore::$p is not ignored"; status=1; }
          done
          exit $status

      - name: Workflow YAML parses
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid YAML"; exit 1; }
          done

  schemas:
    name: Validate schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every non-empty JSON file parses
        run: |
          status=0
          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            python3 -c "import sys, json; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; status=1; }
          done < <(find schemas enums examples -type f -name '*.json' -size +0)
          echo "checked $found non-empty JSON file(s)"
          exit $status

      - name: VERSION is semver, if set
        run: |
          if [ -s VERSION ]; then
            v=$(tr -d '[:space:]' < VERSION)
            echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error file=VERSION::'$v' is not a semver version"; exit 1; }
          else
            echo '::notice::VERSION is empty — no contract version published yet.'
          fi

      - name: Is there a toolchain to run yet?
        id: state
        run: |
          if [ -f package.json ] && [ -s package.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::no package.json yet, so the schema validator and codegen check are skipped.'
          fi

      - name: Set up Node
        if: steps.state.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        if: steps.state.outputs.ready == 'true'
        run: npm ci

      - name: Validate schemas and examples
        if: steps.state.outputs.ready == 'true'
        run: npm run validate

      - name: End-to-end envelope tests
        if: steps.state.outputs.ready == 'true'
        run: npm test

      - name: Set up Python
        if: steps.state.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Type tests (a field typo must fail the build)
        if: steps.state.outputs.ready == 'true'
        run: npm run typecheck

      - name: Cross-check examples with the Python package
        if: steps.state.outputs.ready == 'true'
        run: |
          pip install ./generated/python
          npm run validate:py

      - name: Node and Python checked the same number of examples
        if: steps.state.outputs.ready == 'true'
        run: |
          node_counts=$(npm run -s validate | grep -Eo '[0-9]+ valid and [0-9]+ invalid')
          py_counts=$(npm run -s validate:py | grep -Eo '[0-9]+ valid and [0-9]+ invalid')
          echo "node: $node_counts | python: $py_counts"
          if [ -z "$node_counts" ] || [ "$node_counts" != "$py_counts" ]; then
            echo "::error::Node checked '$node_counts' but Python checked '$py_counts'"
            exit 1
          fi
